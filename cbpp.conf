# cbpp.conf - single source of truth for the CBPP image build.
#
# Edit a value here, run `make apply`, and every derived file under config/
# is rewritten consistently.  `make show` prints the effective settings plus
# exactly what changed on disk.
#
# This file is plain POSIX shell and is only ever sourced by scripts/cbpp-apply.
# Anything not listed here is a live-build knob you can still edit by hand in
# config/*; apply only touches the keys it owns.

# --------------------------------------------------------------- identity --

# Release version of CBPP itself.  Feeds the ISO volume label.
CBPP_VERSION="13.1"

# Metadata burned into the ISO itself.  Every tool that inspects an image shows
# these, and they still read "Debian Live" in the stock live-build config, which
# is the wrong attribution for a CBPP release.
CBPP_ISO_APPLICATION="Croatoan"
CBPP_ISO_PUBLISHER="Croatoan project"

# Volume label used for the HDD image target.
CBPP_HDD_LABEL="CROATOAN"

# ------------------------------------------------------------- branding --

# The name this image calls itself.
#
# Upstream is #!++ / CrunchBang++, and most of that name is baked into other
# people's packages - the conky header, the welcome script, the Openbox menu,
# the installer banner. A hook rewrites those after the packages are installed,
# which is the only place it can be done without forking every cbpp-* package.
#
# What the rebrand cannot reach: strings compiled into debian-installer's own
# udebs, and the CBPP artwork inside cbpp-wallpapers. Set to "" to keep the
# upstream name everywhere.
CBPP_BRANDING="Croatoan"

# Hostname of the live session and the default the installer offers.
CBPP_HOSTNAME="croatoan"

# Debian suite this release is built from.  Feeds config/bootstrap, the
# debian-installer suite, the apt sources shipped in the image, and the
# CBPP package archive URL.
CBPP_DISTRIBUTION="trixie"

# Target architecture.  Feeds LB_ARCHITECTURE and the kernel flavour.
CBPP_ARCH="amd64"

# ----------------------------------------------------------------- kernel --

# Kernel metapackage, *without* the "-${CBPP_ARCH}" suffix - live-build appends
# it (see chroot_linux-image).  "linux-image" resolves to linux-image-amd64,
# which always exists.  Pinning a versioned ABI here (e.g.
# "linux-image-6.19.10+deb13") breaks the build the moment Debian supersedes
# that ABI and drops it from the archive, so prefer the unversioned meta.
CBPP_KERNEL="linux-image"

# Pull a newer kernel from ${CBPP_DISTRIBUTION}-backports during the chroot
# stage.  This is how CBPP ships hardware support newer than stable's kernel.
# Set to "false" to stay on the stable kernel.
CBPP_KERNEL_BACKPORTS="true"

# ------------------------------------------------------------ compression --

# squashfs compressor for the live filesystem.  Passed to mksquashfs as -comp.
#
# Leaving this empty is NOT "no compression" - live-build falls back to xz,
# which is what this repo shipped before.  xz gives the smallest ISO but is slow
# to decompress, and every read from the live filesystem pays that cost, so a
# live session on xz feels sluggish.  zstd trades roughly 10-15% of image size
# for several times faster decompression.  Set this back to "xz" if image size
# matters more to you than how the live session feels.
#
# Valid: gzip, lzo, lz4, xz, zstd.
CBPP_SQUASHFS_COMPRESSION="zstd"

# Compression level, passed as -Xcompression-level.  zstd accepts 1-22; 19 is
# the usual size/build-time sweet spot.  Empty leaves the compressor's default.
CBPP_SQUASHFS_LEVEL="19"

# initramfs compressor.  live-build only accepts gzip, bzip2 and lzma here
# (see chroot_hacks) - it recompresses the generated initramfs by hand and has
# no zstd branch, and it rejects anything outside that list outright.
CBPP_INITRAMFS_COMPRESSION="gzip"

# ---------------------------------------------------------------- mirrors --

CBPP_MIRROR="http://deb.debian.org/debian/"
CBPP_MIRROR_SECURITY="http://security.debian.org/"

# Base URL of the CBPP package archive.  The suite directory and the suite
# name are both taken from CBPP_DISTRIBUTION.
CBPP_PACKAGES_URL="https://packages.crunchbangplusplus.org"

# HTTP proxy for apt during the build.  Point this at a local caching proxy to
# make repeat builds dramatically faster - `make apt-cache` starts one for you
# and prints the value to paste here.  Empty disables it.
CBPP_APT_PROXY=""

# ------------------------------------------------------------------- zram --

# Compressed swap in RAM, set up by systemd-zram-generator.
#
# This matters most for exactly the hardware CBPP targets. A live session has
# no swap partition at all, so without zram the only response to memory
# pressure is the OOM killer; an installed system on an old machine swaps to a
# slow disk. Compressed swap in RAM turns both cases into a CPU cost instead.
CBPP_ZRAM="true"

# Device size, in zram-generator's expression syntax, as a function of MemTotal.
# The generator's own default is min(ram / 2, 4096); Fedora ships min(ram, 8192)
# and relies on compression (roughly 2-3x on real workloads) to come out ahead.
# We follow Fedora, which is safe here because earlyoom below is the backstop.
CBPP_ZRAM_SIZE="min(ram, 8192)"

# Compression algorithm. zstd gives the best ratio at a CPU cost that modern
# kernels absorb well; lzo-rle (the kernel default) or lz4 are faster and are
# the better pick if you are targeting genuinely ancient CPUs.
CBPP_ZRAM_ALGORITHM="zstd"

# Swap priority. Higher than any on-disk swap (which defaults to -2), so an
# installed system with a swap partition fills zram first and only spills to
# disk afterwards.
CBPP_ZRAM_PRIORITY="100"

# -- vm tuning for compressed swap ------------------------------------------
#
# The kernel's defaults assume swap lives on a slow disk. All four of these are
# the values Pop!_OS ships and the Arch wiki documents for zram.

# Swapping to RAM is cheap and wears nothing out, so bias hard towards it.
# The ceiling is 200 on kernels since 5.8.
CBPP_VM_SWAPPINESS="180"

# Swap readahead, as 2^n pages. Readahead is a latency optimisation for seeking
# disks; against zram it just decompresses pages nobody asked for. 0 disables it.
CBPP_VM_PAGE_CLUSTER="0"

# Do not inflate watermarks after memory fragmentation events.
CBPP_VM_WATERMARK_BOOST_FACTOR="0"

# Start reclaiming earlier, so compression has time to keep up under pressure
# instead of the allocator stalling.
CBPP_VM_WATERMARK_SCALE_FACTOR="125"

# Userspace OOM killer. zram has a hard capacity limit, and when it fills with
# no disk swap behind it the kernel OOM killer reacts late enough that the
# machine can thrash unusably first. earlyoom (88 KiB, no dependencies beyond
# libc) steps in before that. Fedora pairs its zram with systemd-oomd for the
# same reason; earlyoom needs no cgroup setup and suits a lightweight image.
CBPP_EARLYOOM="true"

# ---------------------------------------------------------------- firefox --

# Low-memory defaults for Firefox ESR.
#
# Every pref written here was checked against the ESR 140 that trixie ships -
# either in omni.ja or, for the compiled-in ones, in libxul.so - so none of
# them are dead names carried over from old advice.
#
# These are system *defaults*: the user can still change any of them in
# about:config, and doing so wins.
CBPP_FIREFOX_LOWMEM="true"

# Content processes. Firefox defaults to 8. Each one costs tens of MiB before
# it renders anything.
CBPP_FIREFOX_PROCESS_COUNT="2"

# Site isolation (Fission). Leaving it on is the safe choice; turning it off is
# the single largest memory saving available, because Fission is what forces a
# separate process per site rather than per tab.
#
# The cost is real: Fission is the boundary that contains Spectre-style
# side-channel attacks between sites, and Mozilla treats non-Fission as a
# configuration on its way out. Set to "true" to keep isolation.
CBPP_FIREFOX_FISSION="false"

# Deliberately NOT set here: accessibility.force_disabled. It saves memory by
# switching the accessibility engine off entirely, which also switches off
# screen readers. That is not a trade a distribution gets to make on a user's
# behalf; anyone who wants it can set it themselves.

# ------------------------------------------------------------- networking --

# IPv6.
#
# "disabled" switches IPv6 off on real interfaces via sysctl and tells
# NetworkManager not to configure it. Loopback is deliberately left alone, so
# software that binds ::1 keeps working - disabling it there breaks more than
# it helps.
#
# Worth knowing before shipping this: on an IPv6-only network - some mobile
# carriers, some ISPs running DS-Lite, a growing number of hosting networks -
# a machine with IPv6 off has no connectivity at all. Set this to "enabled" to
# get IPv6 back with RFC 4941 privacy extensions, which stop the address from
# being a stable fingerprint of the hardware.
#
# For a harder off switch, add ipv6.disable=1 to CBPP_BOOTAPPEND_LIVE; that
# unloads the module entirely, including on loopback.
CBPP_IPV6="disabled"

# Clock synchronisation.
#
# The image currently ships with none at all: cbpp-metapackage recommends
# "ntp", which no longer exists in trixie, so it silently resolves to nothing.
# A machine whose clock is wrong cannot validate TLS certificates, which makes
# apt and every browser fail in ways that look like anything but a clock
# problem. systemd-timesyncd is already part of systemd upstream and costs
# nothing to enable.
CBPP_TIMESYNC="true"

# ------------------------------------------------------------- desktop UX --

# A one-click "Screenshot" entry in the Openbox root menu, plus the small
# /usr/bin/cbpp-screenshot behind it: grab the whole screen, save it, notify.
#
# CBPP already has screenshot entries, but they sit three levels down under
# Graphics > Take Screenshot and the scrot ones open an image viewer on top of
# what you just captured. This adds the plain one-shot case at the top level.
#
# The menu belongs to cbpp-configs, so a build hook amends the file that
# package installs rather than us shipping a whole copy of the CBPP menu and
# owning every future change to it.
CBPP_SCREENSHOT="true"

# Clipboard manager.
#
# The openbox autostart launches parcellite, which trixie no longer carries -
# so every login runs a command that is not there and users get no clipboard
# history at all. xfce4-clipman is the replacement: a standalone tray app
# rather than a panel plugin, which matters because CBPP uses tint2, and its
# xfce4 libraries are already in the image thanks to thunar and friends.
#
# Rejected: diodon, which pulls zeitgeist-core - an activity-logging daemon is
# the opposite of what this image is for - and copyq, which drags in Qt.
CBPP_CLIPBOARD="xfce4-clipman"

# Conky panel corrections.
#
# The shipped panel lists shortcuts that predate the keybindings we add, so
# Super+q, Super+Return, the desktop numbers and Super+Shift+q are missing from
# it - the list stops describing the system. A hook rewrites that block from
# what rc.xml actually binds, and adds a zram line, since conky has no zram
# object of its own and the swap figure alone does not show the compression.
CBPP_CONKY_PANEL="true"

# The conventional Openbox keybindings CBPP leaves unbound:
#
#   W-q        close window          (only A-F4 today)
#   W-Return   terminal
#   W-1 / W-2  switch desktop        (only W-F1..W-F4 today)
#   W-S-1/2    send window there
#   W-S-q      logout dialog         (only W-x today)
#
# Every one of those keys is free in the shipped rc.xml, so nothing existing is
# rebound. The single exception is Print, which today opens the
# xfce4-screenshooter dialog and is repointed at cbpp-screenshot so it just
# takes the shot, the way it does everywhere else. The dialog stays in the menu.
CBPP_KEYBINDS="true"

# -------------------------------------------------------- display manager --

# Which display manager greets you.
#
#   emptty  a text login on a VT: one 3.6 MiB Go binary whose only libraries
#           are libc, libpam and libx11. No X server, no GTK, no session bus
#           until you actually log in.
#   lxdm    what CBPP ships today: a GTK2 greeter that starts a whole second X
#           server just to draw a login box, then throws it away.
#
# ly, which is what this replaces in spirit, is not packaged in Debian trixie
# at all - it would mean carrying a Zig toolchain and re-porting every release.
# emptty is the same idea and is in main.
#
# Switching also strands cbpp-lxdm-theme, so the hook purges it along with
# lxdm.
CBPP_DISPLAY_MANAGER="emptty"

# Virtual console emptty runs on. tty7 is the traditional X console and has no
# getty on it, so nothing is displaced.
CBPP_DM_TTY="tty7"

# Session emptty preselects. Matched against the names in
# /usr/share/xsessions; if it does not match, emptty falls back to asking.
CBPP_DM_SESSION="Openbox"

# ---------------------------------------------------------------- terminal --

# Black background, grey text, red prompt.
#
# The shipped terminator profile is grey-on-charcoal (#2e3436), and the shell
# prompt is Debian's stock green, neither of which is a decision anyone made
# for this image. The prompt colour is in /etc/skel/.bashrc, which comes from
# the bash package rather than from cbpp-configs, so a hook appends an override
# block instead of us shipping a whole copy of Debian's bashrc.
CBPP_TERMINAL_STYLE="true"

CBPP_TERM_BG="#000000"
CBPP_TERM_FG="#b8b8b8"

# Accent: the prompt, the active window border, and the keyboard indicator.
CBPP_TERM_ACCENT="#cc0000"

# terminator's background_darkness: 1.0 is opaque, 0.0 is invisible. The
# shipped value is 0.83, which is enough to read the wallpaper through body
# text; 0.92 keeps the hint of the wallpaper without it.
CBPP_TERM_OPACITY="0.92"

# Openbox window borders, as a theme derived from CBPP's at build time. The
# stock border is a single light grey (#b7b4b2) on both active and inactive
# windows, so there is no visual cue for focus at all.
CBPP_TERM_BORDER="true"

# ---------------------------------------------------------------- keyboard --

# Keyboard layouts and how to switch between them.
#
# The blue "EN" in the tray today is ibus, pulled in as a Recommends of
# cbpp-metapackage and started by im-config's Xsession script. It is an entire
# input-method framework - GTK3, dconf, python3 and a daemon that sits in RAM -
# for the sole visible purpose of naming the layout, and it does not switch on
# any key combination because no layout but "us" is configured.
#
# Setting the layouts in Xorg means the X server itself does the switching,
# with no daemon involved; the indicator below is a shell one-liner that tint2
# polls. Leave CBPP_KEYBOARD_LAYOUTS empty to keep ibus and change nothing.
CBPP_KEYBOARD_LAYOUTS="us,ru"

# XKB option that toggles the group. Left Alt+Shift is the combination most
# people arrive with. Openbox cannot bind modifier-only chords, which is why
# this is done in XKB rather than in rc.xml.
CBPP_KEYBOARD_TOGGLE="grp:alt_shift_toggle"

# Layout indicator in the tint2 panel, in the accent colour.
CBPP_KEYBOARD_INDICATOR="true"

# -------------------------------------------------------------- wallpaper --

# Default desktop wallpaper, restored at login by `nitrogen --restore` in the
# openbox autostart that cbpp-configs ships.
#
# The generated bg-saved.cfg replaces the one in cbpp-configs' /etc/skel. That
# is a deliberate override of another package's file, but it is four lines and
# exists precisely to be set, so there is nothing to keep in sync.
CBPP_WALLPAPER="/usr/share/backgrounds/croatoan-wallpaper.png"

# nitrogen writes this mode as a bare integer, and the order is fixed on disk:
# 0 scale, 1 tile, 2 center, 3 zoom, 4 auto, 5 zoom-fill.
#
# 3 (zoom) keeps the aspect ratio and letterboxes rather than cropping, so the
# lettering survives on any screen shape. The bars are invisible here because
# the artwork is black at the edges and bgcolor below matches. Use 5 (zoom-fill)
# if you would rather crop than letterbox.
CBPP_WALLPAPER_MODE="3"

# Fills whatever the image does not cover.
CBPP_WALLPAPER_BGCOLOR="#000000"

# -------------------------------------------------------------- fastfetch --

# System information banner with the CBPP sprite.
#
# neofetch is not an option any more: upstream archived it in 2024 and Debian
# dropped it, so it does not exist in trixie. fastfetch is the maintained
# successor, is 1.8 MiB, and needs nothing beyond libc and libyyjson - no
# python, unlike hyfetch/screenfetch.
CBPP_FASTFETCH="true"

# The sprite itself, uncoloured. scripts/cbpp-logo-color paints it and writes
# the ANSI file that ships, so the art stays editable as plain text.
#
#   logo-binary.txt  23 x 37, sparse, drawn in 0s and 1s
#   logo-plain.txt   36 x 44, dense
#
# Whatever you put here has to leave room for the info block beside it: 44
# columns wide and, after CBPP_LOGO_SIZE below, 20 rows tall.
CBPP_LOGO_ART="assets/logo-binary.txt"

# Colour scheme for the sprite. Run
# `scripts/cbpp-logo-color --preview assets/logo-binary.txt /tmp/p.html` to see
# every scheme side by side.
#
# skull-tentacles  white skull, red tentacles
# outline          red outline, white fill
# relief           red edge, grey underlayer, white depth
# glow             white edge, dark interior
# gradient         red at the top, cooling to white at the bottom
# blood            red mass, white silhouette
# mono             white only, tentacles dimmed
CBPP_LOGO_STYLE="skull-tentacles"

# Sprite height. "compact" merges row pairs, halving the art; "full" ships it
# as drawn.
#
# A default terminal window is around 24 rows, and anything taller means
# fastfetch scrolls the top of the logo away and takes the info block with it.
# So art drawn at 36+ rows needs compact - which also corrects its proportions,
# since a terminal cell is roughly twice as tall as it is wide. Art already
# drawn at terminal proportions, like logo-binary.txt, wants full: merging
# would overlay two different rows of digits on top of each other.
CBPP_LOGO_SIZE="full"

# Print the banner on interactive login shells, via /etc/profile.d.
#
# That covers the virtual consoles and SSH. It does NOT cover terminal-emulator
# windows: terminator's shipped profile in cbpp-configs leaves login_shell at
# its default of False, so those start a non-login shell, which reads .bashrc
# and never /etc/profile.d. Fixing that properly is a one-line change in
# cbpp-configs (login_shell = True); we do not override its files from here.
CBPP_FASTFETCH_ON_LOGIN="true"

# ------------------------------------------------------------------- boot --

# Kernel command line for the live session.
CBPP_BOOTAPPEND_LIVE="boot=live components quiet splash username=live hostname=cbpp"

# Kernel command line for the failsafe live entry.
CBPP_BOOTAPPEND_LIVE_FAILSAFE="boot=live components memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash vga=788"

# Extra arguments appended to the installer entries.
CBPP_BOOTAPPEND_INSTALL=""

# Memory tester entry in the boot menu. live-build accepts only memtest86+,
# memtest86 or none. Worth having on an image people reach for as a rescue
# disk; it costs 12 MiB and one menu entry.
CBPP_MEMTEST="memtest86+"

# ------------------------------------------------------------------ build --

# Generate a .zsync file next to the ISO.  Only useful if you publish over
# zsync; it costs build time otherwise.
CBPP_ZSYNC="true"

# Cache downloaded package indices between builds.  Big win when iterating,
# at the cost of possibly reusing a slightly stale Packages file.  Drop the
# cache with `make clean-cache`.
CBPP_CACHE_INDICES="true"

# Docker image used as the build host, and the tag `make image` builds.
CBPP_BUILD_BASE="debian:trixie"
CBPP_BUILD_IMAGE="cbpp-build"
