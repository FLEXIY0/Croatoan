# profiles/lowmem.conf - 2 GB of RAM and a pre-2010 GPU.
#
# Sourced by scripts/cbpp-apply after cbpp.conf, overriding only the keys that
# should differ. Written against a Dell Adamo: Core 2 Duo SU9400 at 1.4 GHz,
# Intel GS45 with GMA 4500MHD, 2 GB of soldered DDR3, 1366x768.
#
# Every value here is wrong on a modern machine, which is exactly why it lives
# in a profile rather than in cbpp.conf. Select it with CBPP_PROFILE="lowmem".

# -- the CPU is from 2008 ---------------------------------------------------

# zstd manages roughly 100 MB/s per core on this CPU against lz4's 400+, and a
# swap fault sits on the critical path of whatever the machine is doing. Less
# capacity that arrives immediately beats more capacity that arrives late, and
# late is what a microstutter is.
CBPP_ZRAM_ALGORITHM="lz4"

# No hardware mitigation for Spectre or Meltdown exists on Penryn, so the
# kernel does it in software - 10-30% on anything that enters the kernel often,
# which is video decoding and I/O. This leaves the machine genuinely open to
# both; it is a decision for a personal laptop, not for a shared one.
CBPP_MITIGATIONS="off"

# -- the GPU predates VP9 ---------------------------------------------------

# YouTube serves VP9 by default and AV1 where it can, and a GMA 4500MHD
# decodes neither - so 720p is decoded on the CPU and stutters however much
# memory is free. Forcing H.264 hands it back to the GPU.
CBPP_FIREFOX_VIDEO="h264"

# Compositing costs video memory bandwidth this GPU has none to spare of, and
# adds a frame of latency - which is what microstutter in video looks like.
CBPP_COMPOSITOR="false"

# -- 2 GB -------------------------------------------------------------------

# One content process holding every tab. The cost is that one page hanging
# hangs them all.
CBPP_FIREFOX_PROCESS_COUNT="1"

# ModemManager, power-profiles-daemon, the at-spi accessibility bus and the
# apt-daily timers. See CBPP_TRIM_DAEMONS in cbpp.conf for what each one is and
# why it has nothing to do here. Note this turns off the accessibility bus,
# which is why it is not the default.
CBPP_TRIM_DAEMONS="true"

# Thunar starts on demand instead of staying resident. About 30 MB, against a
# slower first open of the file manager.
CBPP_THUNAR_DAEMON="false"

# dunst instead of xfce4-notifyd: the same notifications from a C program with
# a living upstream, about 14 MB lighter. They do not look identical, which is
# the only reason this is not the default.
CBPP_NOTIFY="dunst"

# Keep the journal in RAM, capped, and off the disk entirely. Saves memory and
# a great deal of SSD writing. The cost is real: logs do not survive a reboot,
# so a machine that hangs cannot be asked afterwards why.
CBPP_JOURNAL="volatile"
