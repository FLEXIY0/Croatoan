# Enable tap-to-click on touchpads.
#
# This replaces the old 0900-tap-to-click hook, which copied the whole of
# /usr/share/X11/xorg.conf.d into /etc and then sed'd an Option into the
# stock 40-libinput.conf.  That hook shipped in both config/hooks/normal and
# config/hooks/live, so live-build ran it twice: the second pass nested a
# copy of xorg.conf.d inside itself and appended a duplicate Option line.
#
# A drop-in in /etc is read after the packaged snippets in /usr/share, so it
# wins without touching them and keeps working across xorg updates.

Section "InputClass"
	Identifier "cbpp tap-to-click"
	MatchIsTouchpad "on"
	MatchDriver "libinput"
	Option "Tapping" "on"
EndSection
